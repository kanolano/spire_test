[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-of-ash"
version = "0.2.0"
description = "A roguelike deckbuilder that plays in the terminal or the browser."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
spire = "spire_of_ash.term.main:main"
spire-web = "spire_of_ash.web.app:main"

[tool.setuptools.packages.find]
include = ["spire_of_ash*"]

[tool.setuptools.package-data]
"spire_of_ash.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
