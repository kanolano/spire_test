<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spire of Ash</title>
<!-- Inline, so it costs no request and keeps the repo free of binaries. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0810'/%3E%3Cpath d='M16 5C10 13 8 17 8 20a8 8 0 0 0 16 0c0-3-2-7-8-15z' fill='%23e0b978'/%3E%3Cpath d='M16 15c-2.6 3-3.6 4.6-3.6 6.2a3.6 3.6 0 0 0 7.2 0c0-1.6-1-3.2-3.6-6.2z' fill='%23c8503f'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="/static/assets/index-mq0VGjq_.js"></script>
  <link rel="stylesheet" crossorigin href="/static/assets/index-Gw-oI7Eh.css">
</head>
<body>

<!-- The ash used to be eight fixed columns of CSS animation here. It is now a
     canvas that main.ts mounts, which can also spark and burn things off. -->

<header id="top">
  <span class="brand">Spire of Ash</span>
  <span class="sep"></span>
  <span class="stat" id="s-act"></span>
  <span class="stat"><span class="ic" style="color:#e0685a" aria-hidden="true">♥</span>
    <span class="hpwrap" id="s-hpwrap"><i class="hpfill" id="s-hp"></i>
      <span class="hptext" id="s-hptext"></span></span>
  </span>
  <span class="stat" id="s-gold"></span>
  <span class="stat chips" id="s-status"></span>
  <span class="spacer"></span>
  <span class="chips" id="s-relics"></span>
  <span class="chips" id="s-potions"></span>
  <button class="tbtn" data-act="sound" id="s-sound" aria-pressed="false"
          aria-label="Toggle sound"></button>
  <button class="tbtn" data-act="deck">Deck <span class="ghost" id="s-decksize"></span></button>
  <button class="tbtn" data-act="help" aria-label="How to play">?</button>
  <button class="tbtn danger" data-act="quit" aria-label="Abandon this run">Quit</button>
</header>

<main id="stage"></main>
<div id="hint" role="note"></div>

<!-- Combat results are announced here; the visual log is not readable aloud. -->
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<div id="toasts" role="alert" aria-live="assertive"></div>
<div id="tip" role="tooltip" hidden></div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
  <button class="close" data-act="close-overlay">close (esc)</button>
  <h2 id="overlay-title" class="sr-only">Details</h2>
  <div id="overlay-body"></div>
</div>

<div id="curtain" hidden>
  <div class="curtain-box">
    <p id="curtain-msg">Lost contact with the Spire.</p>
    <button class="cta" data-act="reconnect">Try again</button>
  </div>
</div>

</body>
</html>
