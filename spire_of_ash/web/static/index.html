<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spire of Ash</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div id="hitflash" aria-hidden="true"></div>
<div id="turnbanner" aria-hidden="true"></div>

<header id="top">
  <span class="brand">Spire of Ash</span>
  <span class="sep"></span>
  <span class="stat" id="s-act"></span>
  <span class="stat"><span class="ic" style="color:#e0685a" aria-hidden="true">♥</span>
    <span class="hpwrap" id="s-hpwrap"><i class="hpghost" id="s-hpghost"></i><i class="hpfill" id="s-hp"></i>
      <span class="hptext" id="s-hptext"></span></span>
  </span>
  <span class="stat" id="s-gold"></span>
  <span class="stat chips" id="s-status"></span>
  <span class="spacer"></span>
  <span class="chips" id="s-relics"></span>
  <span class="chips" id="s-potions"></span>
  <button class="tbtn" data-act="deck">Deck <span class="ghost" id="s-decksize"></span></button>
  <button class="tbtn" data-act="help" aria-label="How to play">?</button>
  <button class="tbtn danger" data-act="quit" aria-label="Abandon this run">Quit</button>
</header>

<main id="stage"></main>
<div id="hint" role="note"></div>

<!-- Combat results are announced here; the visual log is not readable aloud. -->
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<div id="toasts" role="alert" aria-live="assertive"></div>
<div id="tip" role="tooltip" hidden></div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
  <button class="close" data-act="close-overlay">close (esc)</button>
  <h2 id="overlay-title" class="sr-only">Details</h2>
  <div id="overlay-body"></div>
</div>

<div id="curtain" hidden>
  <div class="curtain-box">
    <p id="curtain-msg">Lost contact with the Spire.</p>
    <button class="cta" data-act="reconnect">Try again</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
